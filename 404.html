<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page Not Found | Rinix Agency</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0A0A0C">
<meta name="color-scheme" content="dark">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-192.png">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Core Styles (Inline for self-containment) -->
<style>
  *,
  *::before,
  *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --bg-primary: #0A0A0C;
    --accent-blue: #00D2FF;
    --accent-violet: #7C3AED;
    --accent-magenta: #C026D3;
    --text-primary: #F8F9FA;
    --text-secondary: #B4B7C5;
    --text-muted: #777B8A;
    --gradient-brand: linear-gradient(135deg, #00D2FF 0%, #7C3AED 55%, #C026D3 100%);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
    position: relative;
  }

  /* Animated background glow */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(600px 500px at 20% 30%, rgba(0, 210, 255, 0.12), transparent 60%),
      radial-gradient(600px 500px at 80% 70%, rgba(192, 38, 211, 0.10), transparent 60%),
      radial-gradient(400px 400px at 50% 50%, rgba(124, 58, 237, 0.06), transparent 50%);
    pointer-events: none;
    animation: glowPulse 8s ease-in-out infinite alternate;
  }

  @keyframes glowPulse {
    0% { opacity: 0.6; transform: scale(1); }
    100% { opacity: 1; transform: scale(1.05); }
  }

  /* Floating particles (decorative) */
  .particles {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: var(--accent-blue);
    border-radius: 50%;
    opacity: 0.15;
    animation: floatParticle 12s infinite linear;
  }

  .particle:nth-child(1) { left: 10%; top: 20%; animation-duration: 14s; animation-delay: 0s; width: 6px; height: 6px; background: var(--accent-violet); }
  .particle:nth-child(2) { left: 85%; top: 15%; animation-duration: 16s; animation-delay: 2s; width: 3px; height: 3px; }
  .particle:nth-child(3) { left: 50%; top: 80%; animation-duration: 18s; animation-delay: 4s; width: 5px; height: 5px; background: var(--accent-magenta); }
  .particle:nth-child(4) { left: 5%; top: 70%; animation-duration: 13s; animation-delay: 1s; width: 4px; height: 4px; }
  .particle:nth-child(5) { left: 92%; top: 60%; animation-duration: 15s; animation-delay: 3s; width: 7px; height: 7px; background: var(--accent-blue); }
  .particle:nth-child(6) { left: 30%; top: 90%; animation-duration: 17s; animation-delay: 5s; width: 3px; height: 3px; }
  .particle:nth-child(7) { left: 70%; top: 10%; animation-duration: 14s; animation-delay: 2.5s; width: 5px; height: 5px; background: var(--accent-violet); }

  @keyframes floatParticle {
    0% { transform: translate(0, 0) scale(1); opacity: 0.1; }
    25% { transform: translate(30px, -40px) scale(1.4); opacity: 0.25; }
    50% { transform: translate(-20px, -80px) scale(0.8); opacity: 0.15; }
    75% { transform: translate(40px, -30px) scale(1.2); opacity: 0.3; }
    100% { transform: translate(0, 0) scale(1); opacity: 0.1; }
  }

  .error-container {
    position: relative;
    z-index: 1;
    text-align: center;
    max-width: 640px;
    padding: 40px 20px;
  }

  .brand-link {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--text-primary);
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
    margin-bottom: 32px;
    transition: opacity 0.3s var(--ease);
  }
  .brand-link:hover { opacity: 0.8; }
  .brand-link img { width: 40px; height: 40px; display: block; }

  .error-code {
    font-family: 'Outfit', sans-serif;
    font-size: clamp(6rem, 20vw, 10rem);
    font-weight: 900;
    line-height: 1;
    background: var(--gradient-brand);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 8px;
    animation: codeGlow 3s ease-in-out infinite alternate;
    letter-spacing: -0.04em;
  }

  @keyframes codeGlow {
    0% { filter: drop-shadow(0 0 20px rgba(0, 210, 255, 0.2)); }
    100% { filter: drop-shadow(0 0 60px rgba(124, 58, 237, 0.4)); }
  }

  .error-eyebrow {
    font-family: 'Outfit', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent-blue);
    margin-bottom: 12px;
  }

  .error-title {
    font-family: 'Outfit', sans-serif;
    font-size: clamp(1.4rem, 3vw, 2rem);
    font-weight: 700;
    margin-bottom: 12px;
    color: var(--text-primary);
  }

  .error-desc {
    font-size: 1.05rem;
    color: var(--text-secondary);
    line-height: 1.7;
    max-width: 500px;
    margin: 0 auto 28px;
  }

  .error-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 32px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 28px;
    border-radius: 10px;
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    text-decoration: none;
    transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease);
    min-height: 48px;
    border: 1px solid transparent;
  }

  .btn-primary {
    background: var(--gradient-brand);
    color: #050507;
  }
  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 40px -12px rgba(0, 210, 255, 0.5);
  }

  .btn-secondary {
    background: rgba(255, 255, 255, 0.04);
    color: var(--text-primary);
    border-color: rgba(255, 255, 255, 0.08);
  }
  .btn-secondary:hover {
    border-color: rgba(0, 210, 255, 0.3);
    background: rgba(0, 210, 255, 0.06);
    transform: translateY(-3px);
  }

  .error-help {
    font-size: 0.85rem;
    color: var(--text-muted);
  }
  .error-help a {
    color: var(--accent-blue);
    text-decoration: none;
    border-bottom: 1px solid rgba(0, 210, 255, 0.3);
    transition: border-color 0.2s;
    font-weight: 500;
  }
  .error-help a:hover { border-color: var(--accent-blue); }

  .error-divider {
    width: 60px;
    height: 2px;
    background: var(--gradient-brand);
    border-radius: 999px;
    margin: 16px auto 20px;
    opacity: 0.4;
  }

  /* Quick navigation mini-grid */
  .quick-links {
    display: flex;
    gap: 8px 16px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .quick-links a {
    font-size: 0.78rem;
    color: var(--text-muted);
    text-decoration: none;
    transition: color 0.2s;
    padding: 4px 8px;
    border-radius: 4px;
  }
  .quick-links a:hover {
    color: var(--text-primary);
    background: rgba(255,255,255,0.04);
  }

  /* Responsive */
  @media (max-width: 480px) {
    .error-actions { flex-direction: column; align-items: center; }
    .btn { width: 100%; justify-content: center; }
    .error-container { padding: 20px 12px; }
    .quick-links { gap: 4px 12px; }
    .quick-links a { font-size: 0.72rem; }
  }

  @media (min-width: 768px) {
    .error-code { font-size: 10rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    body::before { animation: none; }
    .particle { animation: none !important; opacity: 0.08; }
    .error-code { animation: none; filter: none; }
  }
</style>
</head>
<body>

<!-- Decorative Particles -->
<div class="particles" aria-hidden="true">
  <span class="particle"></span>
  <span class="particle"></span>
  <span class="particle"></span>
  <span class="particle"></span>
  <span class="particle"></span>
  <span class="particle"></span>
  <span class="particle"></span>
</div>

<main class="error-container">
  <!-- Brand -->
  <a href="/index.html" class="brand-link">
    <img src="logo.png" alt="Rinix logo" width="40" height="40">
    <span>Rinix</span>
  </a>

  <!-- 404 Content -->
  <p class="error-eyebrow">— Navigation Error —</p>
  <div class="error-code">404</div>
  <h1 class="error-title">This page doesn't exist.</h1>
  <p class="error-desc">
    The page you're looking for may have moved, been renamed, or never existed.
    Let's get you back on track.
  </p>

  <div class="error-actions">
    <a href="/index.html" class="btn btn-primary">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h16M12 5l7 7-7 7"/></svg>
      Back to home
    </a>
    <a href="/index.html#contact" class="btn btn-secondary">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      Start a project
    </a>
  </div>

  <div class="error-divider" aria-hidden="true"></div>

  <div class="error-help">
    Need help? <a href="mailto:contact.rinix@proton.me">contact.rinix@proton.me</a>
  </div>

  <!-- Quick Navigation -->
  <nav class="quick-links" aria-label="Quick navigation">
    <a href="/index.html#about">About</a>
    <a href="/index.html#services">Services</a>
    <a href="/index.html#work">Work</a>
    <a href="/index.html#process">Process</a>
  </nav>
</main>

</body>
</html>
