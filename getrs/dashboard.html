<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your sites — RS Net</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { charcoal: { 950:'#0a0a0b',900:'#121214',800:'#1a1a1d',700:'#242428',600:'#333338',300:'#a8a8b0' }, gold: { 400:'#e8c37a',500:'#d4a94f' }, electric: { 400:'#4f9dff' } },
        fontFamily: { display:['Syne','Inter','sans-serif'], body:['DM Sans','Roboto','sans-serif'] },
      }}
    }
  </script>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
</head>
<body class="font-body">
  <header class="border-b border-charcoal-700 bg-charcoal-950/80 backdrop-blur">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
      <span class="font-display text-lg font-bold tracking-tight">RS <span class="text-gold-500">Net</span></span>
      <div class="flex items-center gap-4">
        <span id="user-email" class="hidden text-sm text-charcoal-300 sm:inline"></span>
        <button id="logout-btn" class="btn-secondary text-sm">Log out</button>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-6 py-10">
    <div class="mb-8 flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="font-display text-2xl font-bold">Your sites</h1>
        <p id="site-count" class="text-sm text-charcoal-300"></p>
      </div>
      <button id="create-btn" class="btn-primary hidden">+ New site</button>
    </div>

    <p id="create-error" class="mb-4 hidden rounded-xl border border-red-400/40 bg-red-400/10 p-3 text-sm text-red-400"></p>

    <div id="loading" class="flex justify-center py-20"><div class="spinner"></div></div>

    <div id="empty-state" class="card hidden flex-col items-center gap-3 px-6 py-16 text-center animate-fade-slide-up">
      <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-charcoal-800 text-2xl">✦</div>
      <h2 class="font-display text-xl font-bold">No sites yet</h2>
      <p class="max-w-sm text-sm text-charcoal-300">Create your first site and start dragging blocks onto the page — no code needed.</p>
      <button id="empty-create-btn" class="btn-primary mt-2">Create your first site</button>
    </div>

    <div id="sites-grid" class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3"></div>
  </main>

  <!-- Site settings modal -->
  <div id="settings-modal" class="fixed inset-0 z-20 hidden items-center justify-center bg-black/60 px-4 animate-fade-in">
    <div class="card w-full max-w-sm animate-scale-in p-6">
      <h2 class="mb-1 font-display text-lg font-bold">Site settings</h2>
      <p id="settings-site-name" class="mb-5 text-sm text-charcoal-300"></p>

      <label class="mb-4 flex items-center justify-between rounded-xl border border-charcoal-700 bg-charcoal-800 px-4 py-3 text-sm">
        Password protect this site
        <input id="settings-protected" type="checkbox" class="h-4 w-4 accent-gold-500" />
      </label>

      <div id="settings-password-fields" class="hidden space-y-3">
        <div>
          <label id="settings-password-label" class="mb-1 block text-sm text-charcoal-300">Password</label>
          <input id="settings-password" type="password" class="input" />
        </div>
        <div>
          <label class="mb-1 block text-sm text-charcoal-300">Confirm password</label>
          <input id="settings-confirm" type="password" class="input" />
        </div>
      </div>

      <p id="settings-error" class="mt-3 hidden text-sm text-red-400"></p>

      <div class="mt-5 flex gap-2">
        <button id="settings-cancel" class="btn-secondary flex-1 text-sm">Cancel</button>
        <button id="settings-save" class="btn-primary flex-1 text-sm">Save</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
