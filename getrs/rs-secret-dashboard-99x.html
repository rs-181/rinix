<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>404</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { charcoal: { 950:'#0a0a0b',900:'#121214',800:'#1a1a1d',700:'#242428',600:'#333338',300:'#a8a8b0' }, gold: { 400:'#e8c37a',500:'#d4a94f' }, electric: { 400:'#4f9dff' } },
        fontFamily: { display:['Syne','Inter','sans-serif'], body:['DM Sans','Roboto','sans-serif'] },
      }}
    }
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="font-body">
  <!-- Default content is a plain 404, same as what any nonexistent page
       shows. admin.js only replaces this with the dashboard after
       confirming (client-side) that the signed-in user's email matches
       the owner email — and even then, every actual read/write it makes
       is independently re-checked by firestore.rules, which is the real
       boundary here, not this page. -->
  <div id="not-found" class="flex min-h-screen flex-col items-center justify-center gap-2 text-center">
    <h1 class="font-display text-2xl font-bold">404</h1>
    <p class="text-sm text-charcoal-300">This page could not be found.</p>
  </div>

  <div id="admin-root" class="hidden min-h-screen"></div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
