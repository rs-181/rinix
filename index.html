<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rinix — We'll Be Right Back</title>
  <meta name="description" content="Rinix Website Development Agency is currently under maintenance. We'll be back shortly." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0a0a0f;
      --card: #12121a;
      --primary: #6c5ce7;
      --primary-glow: rgba(108, 92, 231, 0.4);
      --accent: #00d9ff;
      --text: #ffffff;
      --muted: #8b8b9e;
      --border: rgba(255, 255, 255, 0.08);
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }

    /* Animated background orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.35;
      z-index: 0;
      pointer-events: none;
    }

    .orb-1 {
      width: 420px;
      height: 420px;
      background: var(--primary);
      top: -140px;
      left: -120px;
      animation: float1 12s ease-in-out infinite;
    }

    .orb-2 {
      width: 360px;
      height: 360px;
      background: var(--accent);
      bottom: -140px;
      right: -100px;
      opacity: 0.2;
      animation: float2 14s ease-in-out infinite;
    }

    @keyframes float1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(60px, 40px) scale(1.1); }
    }

    @keyframes float2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-50px, -30px) scale(1.15); }
    }

    /* Grid overlay */
    .grid-overlay {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%);
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 680px;
      width: 100%;
      text-align: center;
    }

    /* Logo */
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 40px;
      text-decoration: none;
      animation: fadeUp 0.8s ease both;
    }

    .logo-mark {
      width: 46px;
      height: 46px;
      border-radius: 13px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: grid;
      place-items: center;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 22px;
      color: #fff;
      box-shadow: 0 8px 30px var(--primary-glow);
    }

    .logo-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .logo-text span {
      color: var(--accent);
    }

    /* Status badge */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 100px;
      background: rgba(108, 92, 231, 0.12);
      border: 1px solid rgba(108, 92, 231, 0.3);
      font-size: 13px;
      font-weight: 500;
      color: #b8adf5;
      margin-bottom: 28px;
      animation: fadeUp 0.8s ease 0.1s both;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 0 rgba(0, 217, 255, 0.6);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(0, 217, 255, 0.6); }
      70% { box-shadow: 0 0 0 10px rgba(0, 217, 255, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 217, 255, 0); }
    }

    /* Heading */
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(32px, 6vw, 52px);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin-bottom: 20px;
      animation: fadeUp 0.8s ease 0.2s both;
    }

    h1 .gradient {
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: clamp(15px, 2vw, 17px);
      line-height: 1.7;
      color: var(--muted);
      max-width: 520px;
      margin: 0 auto 36px;
      animation: fadeUp 0.8s ease 0.3s both;
    }

    /* Progress bar */
    .progress-wrap {
      max-width: 400px;
      margin: 0 auto 40px;
      animation: fadeUp 0.8s ease 0.4s both;
    }

    .progress-track {
      height: 6px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 100px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      border-radius: 100px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      animation: load 4s ease-in-out infinite;
      box-shadow: 0 0 12px var(--primary-glow);
    }

    @keyframes load {
      0% { width: 0%; }
      50% { width: 75%; }
      100% { width: 100%; }
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-top: 10px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* Contact / CTA */
    .cta-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      animation: fadeUp 0.8s ease 0.5s both;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 26px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.25s ease;
      border: 1px solid transparent;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #8b7cf0);
      color: #fff;
      box-shadow: 0 8px 24px var(--primary-glow);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px var(--primary-glow);
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.04);
      border-color: var(--border);
      color: var(--text);
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.18);
      transform: translateY(-2px);
    }

    .btn svg {
      width: 18px;
      height: 18px;
    }

    /* Footer */
    .footer {
      margin-top: 56px;
      font-size: 13px;
      color: var(--muted);
      animation: fadeUp 0.8s ease 0.6s both;
    }

    .footer a {
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer a:hover {
      color: var(--accent);
    }

    .footer .divider {
      margin: 0 10px;
      opacity: 0.4;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 480px) {
      .orb { filter: blur(70px); }
      .logo-mark { width: 40px; height: 40px; font-size: 19px; }
      .logo-text { font-size: 21px; }
      .cta-group { flex-direction: column; }
      .btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <!-- Background effects -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="grid-overlay"></div>

  <main class="container">
    <!-- Logo -->
    <a href="/" class="logo" aria-label="Rinix Home">
      <div class="logo-mark">R</div>
      <div class="logo-text">Rinix<span>.</span></div>
    </a>

    <!-- Status -->
    <div class="status-badge">
      <span class="status-dot"></span>
      Scheduled Maintenance
    </div>

    <!-- Heading -->
    <h1>
      We're upgrading<br />
      <span class="gradient">something awesome.</span>
    </h1>

    <!-- Description -->
    <p>
      Our website is currently under maintenance as we roll out improvements.
      We'll be back online shortly — thanks for your patience!
    </p>

    <!-- Progress -->
    <div class="progress-wrap">
      <div class="progress-track">
        <div class="progress-bar"></div>
      </div>
      <div class="progress-label">
        <span>Deploying updates</span>
        <span>~ Soon</span>
      </div>
    </div>

    <!-- CTA -->
    <div class="cta-group">
      <a href="mailto:info@rinix.online" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2" />
          <path d="m22 7-10 6L2 7" />
        </svg>
        Email Us
      </a>
      <a href="https://wa.me/919725936153" target="_blank" rel="noopener" class="btn btn-ghost">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
        WhatsApp
      </a>
    </div>

    <!-- Footer -->
    <footer class="footer">
      &copy; <span id="year"></span> Rinix Website Development Agency
      <span class="divider">•</span>
      <a href="mailto:info@rinix.online">info@rinix.online</a>
    </footer>
  </main>

  <script>
    // Auto-update year
    document.getElementById('year').textContent = new Date().getFullYear();

    // Optional: auto-refresh every 5 minutes to check if site is back
    // setTimeout(() => location.reload(), 300000);
  </script>
</body>
</html>
